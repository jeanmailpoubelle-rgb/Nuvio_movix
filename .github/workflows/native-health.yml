name: Native plugin maintenance controls
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Native smoke controls or focused Vodix range/media recheck
        type: choice
        options: [all, vodix]
        default: all
  workflow_call:
    inputs:
      provider:
        type: string
        default: all
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: npm test
      - name: Native metadata controls on both literal runtimes
        env:
          NUVIO_TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
          MAINTENANCE_PROVIDER: ${{ inputs.provider || 'all' }}
        run: |
          if [ "$MAINTENANCE_PROVIDER" = vodix ]; then
            python scripts/audit.py --skip-offline --track native --provider vodix --profile deep --runtime both --max-seconds 900 --output reports/native-health
          else
            python scripts/audit.py --skip-offline --track native --profile smoke --runtime both --max-seconds 1500 --output reports/native-health
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-upstream-health
          path: |
            reports/native-health/report.json
            reports/native-health/report.md
          if-no-files-found: warn
          retention-days: 14
