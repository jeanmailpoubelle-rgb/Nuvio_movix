name: Sources EN private live check
on:
  workflow_dispatch:
    inputs:
      case:
        description: Optional maintenance case ID (blank runs all)
        required: false
        default: ""
  push:
    branches: [aiometadata-input]
    paths:
      - 'plugins/sources-en/**'
      - 'src/sources-en/**'
      - 'config/sources-en*.json'
      - 'scripts/verify_sources_en.py'
      - '.github/workflows/sources-en.yml'
permissions:
  contents: read
jobs:
  installed-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Phone discovery, mapping, media and preferred captions
        env:
          SOURCE_CASE: ${{ inputs.case }}
          NUVIO_TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
          NUVIO_AIOMETADATA_MANIFEST_URL: ${{ secrets.NUVIO_AIOMETADATA_MANIFEST_URL }}
        run: |
          if [ -n "$SOURCE_CASE" ]; then
            python scripts/verify_sources_en.py --case "$SOURCE_CASE"
          else
            python scripts/verify_sources_en.py
          fi
      - name: Sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sources-en-public-evidence
          path: reports/sources-en/report.json
          if-no-files-found: warn
          retention-days: 7
