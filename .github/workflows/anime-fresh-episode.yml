name: Anime fresh episode investigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/probe_anime_fresh_episode.py', '.github/workflows/anime-fresh-episode.yml']
permissions:
  contents: read
jobs:
  public-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Compare saved providers, external IDs and native control
        env:
          NUVIO_XPERIENCE_MANIFEST_URL: ${{ secrets.NUVIO_XPERIENCE_MANIFEST_URL }}
          NUVIO_AIOMETADATA_MANIFEST_URL: ${{ secrets.NUVIO_AIOMETADATA_MANIFEST_URL }}
          NUVIO_TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
        run: python scripts/probe_anime_fresh_episode.py
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-episode-public-facts
          path: reports/fresh-episode/probe.json
          retention-days: 3
