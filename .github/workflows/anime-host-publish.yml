name: Publish signed Anime-Sama APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/anime-host-publish.yml']
  workflow_dispatch:
    inputs:
      blob_sha:
        description: Repository Git blob containing the already-signed public APK
        required: true
        type: string
      apk_sha256:
        description: Expected SHA-256 of the signed APK
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - name: Fetch public signed payload and verify hash and original certificate
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_SHA: ${{ inputs.blob_sha }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          blob, expected = os.environ['BLOB_SHA'], os.environ['APK_SHA256']
          if not re.fullmatch(r'[a-f0-9]{40}', blob) or not re.fullmatch(r'[a-f0-9]{64}', expected):
              raise SystemExit('Invalid payload identifiers')
          data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{blob}']))
          raw = base64.b64decode(data['content'])
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('APK hash mismatch')
          target = Path('Anime-Sama-Host-0.1.2.apk')
          target.write_bytes(raw)
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '36.0.0' / 'apksigner'
          certs = subprocess.check_output([str(signer), 'verify', '--print-certs', str(target)], text=True)
          cert = re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)', certs)
          if not cert or cert[1] != '9e6c9d4c30838ac79782a572312528ed172da13d9bf96832d52580067bb80653':
              raise SystemExit('APK does not use the original prototype certificate')
          print('APK hash/signature verified; no signing key was uploaded')
          PY
      - name: Attach verified APK to the prepared draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload anime-host-v0.1.2 Anime-Sama-Host-0.1.2.apk --clobber
