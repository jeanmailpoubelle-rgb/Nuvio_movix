name: Vodix private input compatibility
on:
  workflow_dispatch:
    inputs:
      title:
        description: Focused FR catalogue comparison
        type: choice
        default: remarried-empress
        options: [remarried-empress, the-body]
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: npm run check:build
      - name: TMDB shows and TVDB anime with both saved manifests
        env:
          NUVIO_AIOMETADATA_MANIFEST_URL: ${{ secrets.NUVIO_AIOMETADATA_MANIFEST_URL }}
          NUVIO_XPERIENCE_MANIFEST_URL: ${{ secrets.NUVIO_XPERIENCE_MANIFEST_URL }}
          NUVIO_TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
        run: python scripts/verify_vodix_input.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vodix-input-public-facts
          path: reports/vodix-input/report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Coflix native-coordinate input proof and TVDB guard
        if: ${{ !cancelled() }}
        env:
          NUVIO_AIOMETADATA_MANIFEST_URL: ${{ secrets.NUVIO_AIOMETADATA_MANIFEST_URL }}
          NUVIO_XPERIENCE_MANIFEST_URL: ${{ secrets.NUVIO_XPERIENCE_MANIFEST_URL }}
          NUVIO_TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
        run: python scripts/verify_vodix_input.py --backend coflix --output reports/coflix-input/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coflix-input-public-facts
          path: reports/coflix-input/report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Generic batch episodes, configured FR and Vodix versus native
        if: ${{ !cancelled() }}
        env:
          NUVIO_FR_CASE: ${{ inputs.title || 'remarried-empress' }}
          NUVIO_AIOMETADATA_MANIFEST_URL: ${{ secrets.NUVIO_AIOMETADATA_MANIFEST_URL }}
          NUVIO_XPERIENCE_MANIFEST_URL: ${{ secrets.NUVIO_XPERIENCE_MANIFEST_URL }}
          NUVIO_TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
        run: python scripts/verify_fr_batch_input.py --case "$NUVIO_FR_CASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-batch-input-public-facts
          path: reports/fr-batch-input/report.json
          if-no-files-found: warn
          retention-days: 3
