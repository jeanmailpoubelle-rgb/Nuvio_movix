name: Anime-Sama Android host
on:
  workflow_dispatch:
    inputs:
      configured_check:
        description: Verify hosted IMDb input using saved Xperience and TMDB secrets
        type: boolean
        default: false
  push:
    paths:
      - 'android/addon-host/**'
      - 'scripts/test_android_tv.sh'
      - 'plugins/anime-sama-plus/providers/anime-sama.js'
      - '.github/workflows/anime-host-android.yml'
  pull_request:
    paths:
      - 'android/addon-host/**'
      - 'scripts/test_android_tv.sh'
      - 'plugins/anime-sama-plus/providers/anime-sama.js'
      - '.github/workflows/anime-host-android.yml'
permissions:
  contents: read
concurrency:
  group: anime-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm run check:build
      - working-directory: android/addon-host
        run: ./gradlew :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Configured hosted Hunter IMDb control
        if: github.event_name == 'workflow_dispatch' && inputs.configured_check
        working-directory: android/addon-host
        env:
          ANIME_HOST_INPUT_ADAPTER: xperience
          ANIME_HOST_MANIFEST_URL: ${{ secrets.NUVIO_XPERIENCE_MANIFEST_URL }}
          ANIME_HOST_TMDB_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
        run: ./gradlew :core:liveCheck -PprobeId=tt2098220 -PprobeSeason=1 -PprobeEpisode=1 -PprobeRepeat=2 --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Anime-Sama-Host-0.1.4-unsigned
          path: android/addon-host/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anime-Sama-Host-test-results
          path: |
            android/addon-host/core/build/test-results/test/*.xml
            android/addon-host/app/build/reports/lint-results-release.html

  tv-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Directional navigation on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test_android_tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-TV-navigation-results
          path: |
            android/addon-host/app/build/tv-instrumentation.txt
            android/addon-host/app/build/tv-ui.png
