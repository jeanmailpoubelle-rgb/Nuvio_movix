name: Upstream health audit
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Audit scope
        type: choice
        options: [smoke, deep]
        default: smoke
      runtime:
        description: Nuvio runtime
        type: choice
        options: [both, tv, mobile]
        default: both
permissions:
  contents: read
concurrency:
  group: upstream-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/quickjs_check.py --all --runtime both
      - id: matrix
        env:
          AUDIT_PROFILE: ${{ inputs.profile }}
          AUDIT_RUNTIME: ${{ inputs.runtime }}
        run: python scripts/audit_matrix.py --profile "$AUDIT_PROFILE" --runtime "$AUDIT_RUNTIME" >> "$GITHUB_OUTPUT"
  audit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Installed entry and owned recovery checks
        env:
          NUVIO_TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
          NUVIO_AIOMETADATA_MANIFEST_URL: ${{ secrets.NUVIO_AIOMETADATA_MANIFEST_URL }}
          AUDIT_PROFILE: ${{ inputs.profile }}
          AUDIT_RUNTIME: ${{ inputs.runtime }}
          AUDIT_PROVIDER: ${{ matrix.provider }}
          AUDIT_ENTRY: ${{ matrix.entry }}
        run: python scripts/audit.py --skip-offline --profile "$AUDIT_PROFILE" --runtime "$AUDIT_RUNTIME" --provider "$AUDIT_PROVIDER" --entry-id "$AUDIT_ENTRY" --output reports/health
      - name: Upload sanitized entry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-health-${{ matrix.entry }}
          path: |
            reports/health/report.json
            reports/health/report.md
          if-no-files-found: warn
          retention-days: 14
  summary:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [plan, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: upstream-health-*
          path: reports/shards
      - name: Verify and combine full coverage
        env:
          AUDIT_PROFILE: ${{ inputs.profile }}
          AUDIT_RUNTIME: ${{ inputs.runtime }}
        run: python scripts/audit_matrix.py --profile "$AUDIT_PROFILE" --runtime "$AUDIT_RUNTIME" --merge reports/shards --output reports/combined
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-health
          path: |
            reports/combined/report.json
            reports/combined/report.md
          if-no-files-found: warn
          retention-days: 14
