name: Legacy plugin URL compatibility
on:
  workflow_run:
    workflows: ['Provider checks']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sources-compat-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      # Validate the actual main tip being exported, including manual runs and
      # concurrent commits newer than the workflow_run event's SHA.
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/quickjs_check.py --all --runtime both
      - run: scripts/release/publish-compat.sh
